name: Accessibility checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install http-server
        run: npm install -g http-server

      - name: Serve site
        run: npx http-server -p 8080 &>/dev/null &

      - name: Run pa11y-ci accessibility scan
        run: |
          npx pa11y-ci http://localhost:8080 || true

      - name: Run Lighthouse CI (basic)
        run: |
          npx lhci autorun --upload.target=temporary-public-storage || true
